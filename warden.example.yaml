# open-warden — example configuration
#
# Models, providers, prices and rate limits are built into the application.
# Inspect them with:
#   open-warden models
#   open-warden providers
#
# This file only selects behavior: model, fallbacks, budget, prompts, agents.

# Model alias from `open-warden models` (or a provider/model reference).
model: qwen-coder-30b

# Ordered fallback chain.
fallbacks:
  - glm-5.3-flash
  - deepseek-flash

# Hard cost ceiling per run, in USD. 0 disables the ceiling.
budget: 2.00

fallback:
  on: [rate_limit, quota, unavailable]
  subagents: true
  wait_when_all_blocked: true
  max_retries: 4

prompt:
  global_file: prompts/global.md
  agents:
    builder:
      prompt_file: prompts/builder.md
      workdir: /workspace
    reviewer:
      prompt_file: prompts/reviewer.md
      workdir: /workspace

# Subagent model policy. The delegation policy itself is fixed by the
# application and is not configurable.
subagents:
  model: free-glm
  fallback_model: deepseek-flash

# Token economy. The fixed delegation policy is always active; economy adds
# prevention rules and context/output safeguards.
economy:
  mode: balanced   # off | balanced | aggressive
  # Optional explicit overrides (defaults come from the mode):
  # tool_output: {max_lines: 200, max_bytes: 20480}
  # compaction: {auto: true, keep_tokens: 8000, buffer: 12000}
  # max_output_tokens: 32768
  # max_input_tokens: 0

run:
  timeout: 30m
  poll_interval: 2s
  auto_approve: true
  estimate_divisor: 4
  output_headroom: 4096

# Maximum agents running at once for `open-warden agents`.
max_parallel: 4

# Persisted rate-limit windows and run history.
state_file: /data/state/state.json
