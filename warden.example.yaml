# open-warden — example configuration
#
# Models, providers, prices and rate limits are built into the application.
# Inspect them with:
#   open-warden models
#   open-warden providers
#
# This file only selects behavior: model, fallbacks, budget, prompts, agents.

# Model alias from `open-warden models` (or a provider/model reference).
model: qwen-coder-30b

# Ordered fallback chain.
fallbacks:
  - glm-5.3-flash
  - deepseek-flash

# Hard cost ceiling per run, in USD. 0 disables the ceiling.
budget: 2.00

fallback:
  on: [rate_limit, quota, unavailable]
  subagents: true
  wait_when_all_blocked: true
  max_retries: 4

prompt:
  global_file: prompts/global.md
  agents:
    builder:
      prompt_file: prompts/builder.md
      workdir: /workspace
    reviewer:
      prompt_file: prompts/reviewer.md
      workdir: /workspace

# Subagent policy: model aliases and the instruction injected into subagents.
subagents:
  model: free-glm
  fallback_model: deepseek-flash
  instruction_file: prompts/subagents.md

run:
  timeout: 30m
  poll_interval: 2s
  auto_approve: true
  estimate_divisor: 4
  output_headroom: 4096

# Maximum agents running at once for `open-warden agents`.
max_parallel: 4

# Persisted rate-limit windows and run history.
state_file: /data/state/state.json
